<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Facebook Seitenassistent</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            max-width:900px;
            margin:40px auto;
            padding:20px;
            background:#f5f5f5;
        }

        .card{
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        h1{
            margin-top:0;
            color:#1877F2;
        }

        input, textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            box-sizing:border-box;
        }

        button{
            background:#1877F2;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:6px;
            cursor:pointer;
        }

        button:hover{
            background:#0f5ec7;
        }
    </style>

</head>

<body>

<div class="card">

<h1>Facebook Seitenassistent</h1>

<p>Willkommen beim Facebook Seitenassistenten.</p>

<label>Facebook-Link</label>
<input type="text" placeholder="https://www.facebook.com/...">

<label>Originaltext</label>
<textarea rows="8"></textarea>

<button>Noch ohne Funktion</button>

</div>

</body>
</html>
